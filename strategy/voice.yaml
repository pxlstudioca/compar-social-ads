# Voiceover settings for Reels. Requirement (Marc-Antoine, 2026-10-29): Québec French accent, nothing else.
#
# Engine: the ElevenLabs connector (claude.ai custom connector "ElevenLabs"), tool creative_generate_speech.
# Higgsfield voices (presets and a Higgsfield clone) came out as international French: never use them for Reels.
# Higgsfield also rejects ElevenLabs voice IDs.

enabled: true
model_id: eleven_v4
generations_count: 1          # the run can't listen to choose between takes, so one take per Reel
cost: about 307 ElevenLabs credits per 20-second voiceover (1 credit per character)

# Two ElevenLabs Voice Library voices chosen by Marc-Antoine. Alternate them Reel by Reel:
# use the voice that was NOT used on the most recent Reel in log/posts.csv (notes field "voice=<key>").
# The weekly review compares their results.
voices:
  tremblay: {name: "Québec Tremblay - Jeune Homme québécois", gender: male,   voice_id: 0Z7Lo7cYVyjM6WL0AP0n}
  amelie:   {name: "Amelie - Quebec, Canada",                 gender: female, voice_id: UJCi4DDncuo0VJDSIegj}
rotation: alternate
first_used: tremblay           # Friday 2026-10-30 Halloween Reel

# Download: the connector returns a signed content_url on storage.googleapis.com (allowed in Capabilities, expires after 2 h).

# Script tips: short sentences, commas where you'd breathe, Québec words spelled as said ("pis", "fait que"),
# numbers written out, under about 320 characters for a 20-second Reel.
