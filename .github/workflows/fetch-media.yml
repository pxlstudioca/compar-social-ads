# Downloads Higgsfield outputs for the daily run.
# The Claude runs can reach GitHub but not Higgsfield's CDNs, so a run pushes a request to inbox/,
# this workflow downloads the files and publishes them on the `media` branch, and the run reads them from there.
name: fetch-media

on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-media
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download requested media
        run: python3 .github/scripts/fetch_media.py
